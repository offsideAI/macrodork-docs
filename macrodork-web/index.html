    <title>OffsideRobotics · MacroDork</title>
    <meta name="description" content="MacroDork is an open, buildable bipedal robot duck. Assembly drawings, CAD, bill of materials, printable parts and a full electronics teardown. By OffsideRobotics, powered by Offside.AI." />
    <meta name="theme-color" content="#FF7A00" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('offsiderobotics-theme');
          if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
